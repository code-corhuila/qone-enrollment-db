# The enrollment database as qone-infra composes it (Annex G): its own PostgreSQL instance with a
# fixed image version, a volume and a health check, plus the Flyway runner behind the tooling
# profile:  docker compose --env-file .env --profile tooling run --rm enrollment-db-migrate
services:
  enrollment-db:
    image: postgres:16.4-alpine
    container_name: enrollment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ENROLLMENT_DB_NAME:-enrollment}
      POSTGRES_USER: ${ENROLLMENT_DB_USER:-enrollment}
      POSTGRES_PASSWORD: ${ENROLLMENT_DB_PASSWORD:?ENROLLMENT_DB_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - enrollment-db-data:/var/lib/postgresql/data
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENROLLMENT_DB_USER:-enrollment} -d ${ENROLLMENT_DB_NAME:-enrollment}"]
      interval: 5s
      timeout: 3s
      retries: 10

  enrollment-db-migrate:
    image: flyway/flyway:10.22.0
    container_name: enrollment-db-migrate
    profiles: ["tooling"]
    depends_on:
      enrollment-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://enrollment-db:5432/${ENROLLMENT_DB_NAME:-enrollment}
      FLYWAY_USER: ${ENROLLMENT_DB_USER:-enrollment}
      FLYWAY_PASSWORD: ${ENROLLMENT_DB_PASSWORD:?ENROLLMENT_DB_PASSWORD is required}
    volumes:
      - ../migrations:/workspace/migrations:ro
      - ../flyway.toml:/workspace/flyway.toml:ro
    entrypoint: ["flyway", "-workingDirectory=/workspace", "-configFiles=/workspace/flyway.toml"]
    command: ["migrate"]
    networks:
      - platform

volumes:
  enrollment-db-data:

networks:
  platform:
    external: true
